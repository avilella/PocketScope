# EpitopeScope metric dictionary
# generated by epitopescope 0.2.0
#
# One entry per column of the <antigen>.<tag>.csv files. `high` and `low` say what an
# extreme value means in practice; `direction` says which end is desirable, or
# `context` when neither end is inherently good.
run:
  epitopescope_version: 0.2.0
  embedding_backend: esm2
  surface_mode: monomer
  n_antigens: 48
  n_epitopes: 571
  crosstalk_cluster_cut: 0.7981
  temperature_K: 310.15
  weights: {epitope: 1.0, orthogonality: 1.5, pure: 1.5}
columns:
  - name: rank
    description: "Position of this epitope within its antigen, 1 = best nanobody_target_score."
    high: "Ranked far down; better candidates exist on the same antigen."
    low: "Top candidate for this antigen."
    direction: lower_is_better
    colour: RdBu
  - name: epitope_id
    description: "Unique epitope label, <antigen>|<chain>|E<nn>."
    colour: Spectral
  - name: antigen
    description: "Input PDB file stem this epitope belongs to."
    colour: Spectral
  - name: chain
    description: "Chain of the antigen carrying the epitope."
    colour: Spectral
  - name: n_epitope_residues
    description: "Residues in the epitope patch."
    high: "A large patch; more contact surface but harder for one VHH paratope to cover fully."
    low: "A small patch; easy to cover but offers little to bind."
    direction: context
    colour: RdBu
  - name: nanobody_target_score
    description: "Overall ranking score: weighted geometric mean of the epitope, orthogonality and PURE axes, so a failure on any one axis cannot be masked."
    high: "Good epitope, orthogonal to the other antigens, and expressible in PURE."
    low: "Fails on at least one axis; read the three sub-scores to see which."
    direction: higher_is_better
    colour: RdBu
  - name: epitope_score
    description: "How plausible this patch is as a nanobody epitope from geometry alone."
    high: "Well exposed, right size for a VHH paratope, rigid, chemically balanced."
    low: "Too small, too flat, too floppy or too greasy to be a good epitope."
    direction: higher_is_better
    colour: RdBu
  - name: orthogonality_score
    description: "Rank of this epitope's worst cross-antigen match within the candidate pool; 1 = the mildest worst-case match in the run."
    high: "Distinctive: nothing on the other antigens looks like it."
    low: "Its closest look-alike on another antigen is among the most similar pairs in the run."
    direction: higher_is_better
    colour: RdBu
  - name: pure_ivtt_score
    description: "How likely the minimal construct carrying this epitope is to be made and folded by an E. coli PURE in-vitro transcription/translation reaction."
    high: "Compact, cysteine-light, ordered, excisable, monomeric: a good PURE construct."
    low: "Blocked by disulfides, glycosylation, hydrophobic segments, disorder or size."
    direction: higher_is_better
    colour: RdBu
  - name: pure_zone
    description: "Three-colour developability call, the BOILED-Egg analogue: GREEN, YELLOW or RED from construct length, exposed hydrophobic surface and rules passed."
    high: "GREEN: short, polar-surfaced and clearing at least 6 of the 7 rules. Order it."
    low: "RED: too long, too greasy, or failing several rules. Redesign or pick another epitope."
    direction: context
    colour: Spectral
  - name: n_pure_rules_passed
    description: "How many of the 7 named PURE rules this construct passes."
    high: "Clears nearly every named liability."
    low: "Trips several independent liabilities at once."
    direction: higher_is_better
    colour: RdBu
  - name: pure_rules_all_pass
    description: "1 when all 7 PURE rules pass, else 0."
    high: "No named liability at all."
    low: "At least one rule fails."
    direction: higher_is_better
    colour: RdBu
  - name: flags
    description: "Human-readable list of the specific liabilities detected, '-' when none."
    colour: Spectral
  - name: site_source
    description: "Which detector proposed this site: concavity_cluster (a surface depression found by ray-cast concavity clustering) or surface_seed (an exposed-residue seed)."
    colour: Spectral
  - name: site_buriedness
    description: "Fraction of outward rays from the patch that are blocked again by the protein within reach; the concavity measure."
    high: "A groove or pocket, walled in on most sides; the site type nanobody CDR3 loops favour."
    low: "A convex bulge sticking out into solvent."
    direction: context
    colour: RdBu
  - name: site_center_x
    description: "x of the patch centroid, angstrom, in the input file's frame."
    colour: RdBu
  - name: site_center_y
    description: "y of the patch centroid, angstrom, in the input file's frame."
    colour: RdBu
  - name: site_center_z
    description: "z of the patch centroid, angstrom, in the input file's frame."
    colour: RdBu
  - name: site_box_A
    description: "Edge length of a cubic box enclosing the patch, angstrom; the design or docking box for this site."
    high: "A large, spread-out site."
    low: "A tight, compact site."
    direction: context
    colour: RdBu
  - name: dg_est_kcal_mol
    description: "Estimated interface free energy from the area a VHH paratope would bury, split into apolar and polar terms, plus a penalty for a flexible epitope. An estimate from geometry, not a prediction for any particular designed binder."
    high: "Near zero: little burial available, weak binding expected."
    low: "Strongly negative: a large, well-formed interface is available."
    direction: lower_is_better
    colour: RdBu
  - name: kd_est_M
    description: "Dissociation constant implied by dg_est at 310.15 K, in molar."
    high: "Weak: a high Kd means little binding."
    low: "Tight binding implied."
    direction: lower_is_better
    colour: RdBu
  - name: pkd_est
    description: "-log10(kd_est_M); 9 is nanomolar, 6 is micromolar."
    high: "Tight binding implied by the available interface."
    low: "Only weak binding is geometrically available here."
    direction: higher_is_better
    colour: RdBu
  - name: buried_area_est_A2
    description: "Antigen-side area a paratope could bury, capped at --paratope-area."
    high: "A large contact surface is available."
    low: "Little surface to bind; affinity will be hard to reach."
    direction: higher_is_better
    colour: RdBu
  - name: apolar_index
    description: "Exposed apolar fraction of the patch mapped onto a logP-like 0-5 scale."
    high: "A greasy patch: sticky and prone to non-specific binding."
    low: "A polar, more selectively recognisable patch."
    direction: lower_is_better
    colour: RdBu
  - name: epitope_le
    description: "Ligand-efficiency analogue: -dg_est per epitope residue, kcal/mol/residue."
    high: "Every residue of the epitope earns its place."
    low: "A large epitope contributing little binding per residue."
    direction: higher_is_better
    colour: RdBu
  - name: epitope_lle
    description: "Lipophilic-efficiency analogue: pkd_est minus apolar_index. Discounts affinity that is bought with greasy surface rather than specific contacts."
    high: "Affinity comes from specific, polar contacts: the selective kind."
    low: "Affinity is mostly hydrophobic stickiness; expect poor specificity."
    direction: higher_is_better
    colour: RdBu
  - name: epitope_fq
    description: "Fit-quality analogue: epitope_le over the efficiency expected for an epitope of this size, fitted across the whole run. 1.0 is exactly typical."
    high: "More efficient than other epitopes of the same size."
    low: "Less efficient than its size would predict."
    direction: higher_is_better
    colour: RdBu
  - name: epitope_complexity_index
    description: "Structural-complexity analogue combining patch size, residue variety and sequence discontinuity, 0-1."
    high: "A large, chemically varied, conformational epitope: distinctive but harder to mimic."
    low: "A small, uniform, largely linear epitope: simple but less distinctive."
    direction: context
    colour: RdBu
  - name: epitope_residues
    description: "Epitope residues as <aa><resseq>, in sequence order."
    colour: Spectral
  - name: rfdiffusion_hotspots
    description: "Five most exposed epitope residues, formatted for the RFdiffusion ppi.hotspot_res argument."
    colour: Spectral
  - name: epitope_sequence
    description: "One-letter sequence of the epitope residues in sequence order."
    colour: Spectral
  - name: crosstalk_max
    description: "Raw MaxSim similarity to the most similar patch on a DIFFERENT antigen. Absolute scale depends on --embed, so compare within a run."
    high: "A patch on another antigen looks very much like this one: cross-binding risk."
    low: "Nothing on the other antigens resembles it."
    direction: lower_is_better
    colour: RdBu
  - name: crosstalk_partner
    description: "The epitope_id on another antigen that this one most resembles."
    colour: Spectral
  - name: crosstalk_top3
    description: "Mean similarity to the three most similar patches on other antigens."
    high: "Resembles several other antigens, not just one."
    low: "Distinctive against the whole collection."
    direction: lower_is_better
    colour: RdBu
  - name: crosstalk_percentile
    description: "Rank of crosstalk_max among all candidates in the run, 0-1."
    high: "Among the worst cross-talk in the run."
    low: "Among the most distinctive epitopes in the run."
    direction: lower_is_better
    colour: RdBu
  - name: crosstalk_within_antigen
    description: "Similarity to the most similar patch on the SAME antigen."
    high: "The antigen presents this surface twice; one nanobody may bind two sites on it."
    low: "The epitope is unique on its own antigen."
    direction: lower_is_better
    colour: RdBu
  - name: crosstalk_z
    description: "Robust z-score of crosstalk_max against all cross-antigen pairs in the run."
    high: "Far above the typical cross-antigen similarity: a real outlier pairing."
    low: "At or below the background level of similarity."
    direction: lower_is_better
    colour: RdBu
  - name: panel_selected
    description: "1 if the panel optimiser picked this epitope as its antigen's representative in the mutually orthogonal set."
    high: "1: this is the recommended epitope for this antigen in a multiplexed panel."
    low: "0: not chosen; another epitope on this antigen separates better from the rest."
    direction: higher_is_better
    colour: RdBu
  - name: panel_worst_crosstalk
    description: "For a selected epitope, its worst similarity to another panel member. Blank for unselected rows."
    high: "Even the chosen panel still has a confusable pair here."
    low: "The chosen panel is well separated at this epitope."
    direction: lower_is_better
    colour: Spectral
  - name: panel_worst_partner
    description: "The panel member this one is most confusable with."
    colour: Spectral
  - name: crosstalk_cluster
    description: "Average-linkage cluster of the cross-talk matrix. Epitopes sharing a cluster present similar surfaces, so take at most one nanobody per cluster."
    colour: RdBu
  - name: cluster_size
    description: "Number of epitopes in this cluster."
    high: "Sits in a crowded cluster of look-alike surfaces."
    low: "A singleton cluster: a distinctive surface."
    direction: lower_is_better
    colour: RdBu
  - name: cluster_n_antigens
    description: "Distinct antigens represented in this cluster."
    high: "The look-alike surface recurs on several antigens: real multiplexing risk."
    low: "Confined to one antigen."
    direction: lower_is_better
    colour: RdBu
  - name: pc1
    description: "First principal component of the standardised epitope descriptor matrix; the dominant axis of variation across every epitope in the run."
    high: "At one extreme of the main descriptor axis, typically the large, buried, high-affinity end."
    low: "At the opposite extreme, typically the small, exposed, low-affinity end."
    direction: context
    colour: RdBu
  - name: pc2
    description: "Second principal component of the epitope descriptor matrix."
    high: "One extreme of the second axis of variation; inspect the loadings to interpret it."
    low: "The opposite extreme of that axis."
    direction: context
    colour: RdBu
  - name: pc3
    description: "Third principal component of the epitope descriptor matrix."
    high: "One extreme of the third axis of variation."
    low: "The opposite extreme."
    direction: context
    colour: RdBu
  - name: proteome_offtarget_max
    description: "Best MaxSim against the prebuilt PocketScope human pocketome, when --index is used. Blank otherwise."
    high: "Something in the human proteome presents a similar constellation: investigate."
    low: "No close match in the indexed pocketome."
    direction: lower_is_better
    colour: RdBu
  - name: proteome_offtarget_hit
    description: "Accession and pocket id of that best proteome match."
    colour: Spectral
  - name: patch_area_A2
    description: "Summed exposed area of the epitope residues, angstrom^2."
    high: "A large surface; more than one paratope can cover at once."
    low: "Too small to support a high-affinity interface."
    direction: context
    colour: RdBu
  - name: mean_rel_sasa
    description: "Mean relative solvent accessibility of the epitope residues, 0-1."
    high: "Fully solvent exposed and reachable."
    low: "Partly buried; a paratope may not reach it."
    direction: higher_is_better
    colour: RdBu
  - name: protrusion
    description: "Distance of the patch centroid from the protein centroid, in radii of gyration."
    high: "Sits on a protruding feature, sterically easy to approach."
    low: "Sits in a recessed region of the surface."
    direction: context
    colour: RdBu
  - name: concavity
    description: "Concavity of the patch, 0-1, from ray-cast buriedness."
    high: "A cleft or groove; the site type nanobody CDR3 loops reach into."
    low: "A flat or convex surface, better suited to a broad flat paratope."
    direction: context
    colour: RdBu
  - name: planarity_A
    description: "RMS spread of patch residues along their least-varying axis, angstrom."
    high: "A rough, three-dimensional surface with real topography."
    low: "A flat surface offering little shape complementarity."
    direction: context
    colour: RdBu
  - name: seq_contiguity
    description: "Fraction of the epitope in its largest contiguous sequence run, 0-1."
    high: "Close to a linear epitope: easier to transplant as a peptide."
    low: "A conformational epitope needing the folded domain."
    direction: context
    colour: RdBu
  - name: rigidity
    description: "Conformational rigidity from pLDDT or B-factors, 0-1."
    high: "Well ordered: a stable target for design."
    low: "Mobile or disordered: an unreliable epitope."
    direction: higher_is_better
    colour: RdBu
  - name: mean_bfactor_or_plddt
    description: "Mean B-factor, or mean pLDDT when the input is a predicted model. The two scales run in opposite directions, which is why `rigidity` exists."
    high: "For a pLDDT column, confidently predicted and rigid. For a B-factor column, mobile."
    low: "For a pLDDT column, poorly predicted and likely disordered. For a B-factor column, well ordered."
    direction: context
    colour: RdBu
  - name: net_charge
    description: "Formal net charge of the epitope residues at neutral pH."
    high: "Strongly basic patch; a binder will need acidic complementarity."
    low: "Strongly acidic patch."
    direction: context
    colour: RdBu
  - name: hydrophobic_frac
    description: "Fraction of epitope residues with apolar side chains."
    high: "Greasy epitope: sticky and often non-specific."
    low: "Polar epitope: usually more selectively recognisable."
    direction: context
    colour: RdBu
  - name: interface_buried_A2
    description: "Epitope area buried by another chain in the deposited assembly."
    high: "The epitope is occluded in the assembly and may not exist on a PURE monomer."
    low: "Fully available on the isolated chain."
    direction: lower_is_better
    colour: RdBu
  - name: cofactor_contact
    description: "Non-water heteroatom group contacting the epitope, or '-'."
    colour: Spectral
  - name: construct_range
    description: "Chain and residue range of the minimal construct carrying the epitope."
    colour: Spectral
  - name: construct_len
    description: "Length of that construct in residues."
    high: "A long construct; PURE yield and folding both fall away with size."
    low: "A short construct, but too short may not fold autonomously."
    direction: context
    colour: RdBu
  - name: construct_mw_da
    description: "Molecular weight of the construct, daltons."
    high: "Heavy; approaching or past the practical PURE ceiling."
    low: "Small and well within PURE's comfortable range."
    direction: lower_is_better
    colour: RdBu
  - name: construct_pI
    description: "Isoelectric point of the construct."
    high: "Basic construct."
    low: "Acidic construct. Either is fine; a pI near the working pH is not."
    direction: context
    colour: RdBu
  - name: construct_gravy
    description: "Grand average of hydropathy over the construct."
    high: "Hydrophobic overall: aggregation risk in a chaperone-poor mix."
    low: "Hydrophilic overall: generally better behaved."
    direction: lower_is_better
    colour: RdBu
  - name: construct_disorder_frac
    description: "Fraction of the construct below pLDDT 70. 0 when the input is not a predicted model."
    high: "Largely disordered: will not fold to a defined target."
    low: "Well ordered throughout."
    direction: lower_is_better
    colour: RdBu
  - name: dangling_contact_frac
    description: "Fraction of the construct's residue contacts severed by cutting it out of the parent chain."
    high: "Excision shreds the domain's core; the fragment will not fold alone."
    low: "The fragment is a self-contained structural unit."
    direction: lower_is_better
    colour: RdBu
  - name: n_cys
    description: "Cysteines in the construct."
    high: "Many cysteines: misoxidation and aggregation risk in PURE."
    low: "Few or none: no redox liability."
    direction: lower_is_better
    colour: RdBu
  - name: ss_internal
    description: "Disulfide bonds fully inside the construct."
    high: "The fold depends on disulfides that a reducing PURE reaction will not form."
    low: "No disulfide dependence."
    direction: lower_is_better
    colour: Spectral
  - name: ss_broken_by_excision
    description: "Disulfides with exactly one partner inside the construct."
    high: "Excision leaves unpaired cysteines from a broken disulfide: the worst redox case."
    low: "No disulfide is cut by the construct boundary."
    direction: lower_is_better
    colour: RdBu
  - name: nglyc_sequons_construct
    description: "N-X-S/T sequons in the construct."
    high: "Many native glycosylation sites; the E. coli product differs from the native antigen."
    low: "Few or none."
    direction: lower_is_better
    colour: Spectral
  - name: nglyc_sequons_in_epitope
    description: "N-X-S/T sequons inside the epitope itself."
    high: "The epitope is glycan-dependent natively and will present differently from PURE."
    low: "The epitope surface is glycan-free."
    direction: lower_is_better
    colour: RdBu
  - name: max_hydropathy_w19
    description: "Highest mean Kyte-Doolittle hydropathy over any 19-residue window."
    high: "A transmembrane-like segment: aggregates without a membrane."
    low: "No hydrophobic stretch long enough to cause trouble."
    direction: lower_is_better
    colour: RdBu
  - name: exposed_hydrophobic_frac
    description: "Fraction of the construct's exposed area from apolar residues."
    high: "A greasy exterior: the main aggregation driver in PURE."
    low: "A well-behaved polar exterior."
    direction: lower_is_better
    colour: RdBu
  - name: rule_size_pass
    description: "PURE rule 1, size: 45-300 residues and at most 35 kDa."
    high: "1: the construct is inside the size window PURE handles well."
    low: "0: too short to fold alone, or heavy enough that PURE yield falls away."
    direction: higher_is_better
    colour: RdBu
  - name: rule_redox_pass
    description: "PURE rule 2, redox: no disulfide required by the fold, and none severed by the construct boundary."
    high: "1: nothing depends on oxidation, so a reducing PURE reaction is fine."
    low: "0: the fold needs a disulfide PURE will not form, or excision leaves an unpaired cysteine."
    direction: higher_is_better
    colour: RdBu
  - name: rule_glyco_pass
    description: "PURE rule 3, glycosylation: no N-X-S/T sequon inside the epitope."
    high: "1: the epitope surface is the same glycosylated or not."
    low: "0: the native epitope is glycan-modified, so the E. coli product presents a different surface there."
    direction: higher_is_better
    colour: RdBu
  - name: rule_membrane_pass
    description: "PURE rule 4, membrane: no 19-residue window above 1.6 mean Kyte-Doolittle hydropathy."
    high: "1: no transmembrane-like stretch."
    low: "0: a membrane-like segment that will aggregate with no membrane to insert into."
    direction: higher_is_better
    colour: RdBu
  - name: rule_domain_pass
    description: "PURE rule 5, domain: at most 30 % of the construct's residue contacts are severed by cutting it out."
    high: "1: the fragment is a self-contained structural unit."
    low: "0: excision shreds the hydrophobic core; the fragment will not fold alone."
    direction: higher_is_better
    colour: RdBu
  - name: rule_monomer_pass
    description: "PURE rule 6, monomer: less than 200 A^2 of the epitope is buried by another chain in the deposited assembly."
    high: "1: the epitope exists on the isolated chain PURE will make."
    low: "0: a quaternary epitope that may not exist on a monomer."
    direction: higher_is_better
    colour: RdBu
  - name: rule_order_pass
    description: "PURE rule 7, order: at most 20 % of the construct below pLDDT 70."
    high: "1: well ordered throughout."
    low: "0: substantially disordered, so neither expressible nor a stable design target."
    direction: higher_is_better
    colour: RdBu
  - name: epi_area
    description: "Sub-score in [0,1]: the exposed-area term, rising monotonically with patch area. One factor of the epitope axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: Spectral
  - name: epi_topography
    description: "Sub-score in [0,1]: the surface-topography term, rewarding three-dimensional relief. One factor of the epitope axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: Spectral
  - name: epi_rigidity
    description: "Sub-score in [0,1]: the rigidity term from pLDDT or B-factors. One factor of the epitope axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: RdBu
  - name: epi_cleft
    description: "Sub-score in [0,1]: the cleft-character term, rewarding concave sites. One factor of the epitope axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: RdBu
  - name: epi_exposure
    description: "Sub-score in [0,1]: the solvent-exposure term. One factor of the epitope axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: Spectral
  - name: epi_polarity
    description: "Sub-score in [0,1]: the composition term, penalising all-hydrophobic patches. One factor of the epitope axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: Spectral
  - name: pure_length
    description: "Sub-score in [0,1]: the construct-size term against the PURE ceiling. One factor of the PURE axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: RdBu
  - name: pure_redox
    description: "Sub-score in [0,1]: the disulfide term for a reducing PURE reaction. One factor of the PURE axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: Spectral
  - name: pure_glycan
    description: "Sub-score in [0,1]: the N-glycosylation term. One factor of the PURE axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: Spectral
  - name: pure_membrane
    description: "Sub-score in [0,1]: the transmembrane-segment term. One factor of the PURE axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: Spectral
  - name: pure_excisable
    description: "Sub-score in [0,1]: the term for how cleanly the construct cuts out of its parent. One factor of the PURE axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: RdBu
  - name: pure_aggregation
    description: "Sub-score in [0,1]: the exposed-hydrophobic-surface term. One factor of the PURE axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: Spectral
  - name: pure_order
    description: "Sub-score in [0,1]: the disorder term. One factor of the PURE axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: Spectral
  - name: pure_monomeric
    description: "Sub-score in [0,1]: the term for epitopes that only exist in an oligomer. One factor of the PURE axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: Spectral
  - name: pure_cofactor_free
    description: "Sub-score in [0,1]: the cofactor and glycan dependence term. One factor of the PURE axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: Spectral
  - name: pure_solubility
    description: "Sub-score in [0,1]: the term for constructs whose pI sits on the working pH. One factor of the PURE axis geometric mean."
    high: "This factor is not a problem for this candidate."
    low: "This factor is what is dragging the candidate down."
    direction: higher_is_better
    colour: Spectral
  - name: construct_sequence
    description: "Amino-acid sequence of the proposed PURE construct."
    colour: Spectral
